name: 🚀 Innerpece Website Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: innerpece-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source
      # --------------------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mainsource/package-lock.json

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: 📦 Install Dependencies
        working-directory: mainsource
        run: npm ci

      # --------------------------------------------------
      # 4. Build Vite application
      # --------------------------------------------------
      - name: 🏗️ Build Vite Application
        working-directory: mainsource
        run: npm run build

      # --------------------------------------------------
      # 5. Verify build
      # --------------------------------------------------
      - name: 🔎 Verify Build
        run: |
          set -e

          test -d mainsource/dist
          test -f mainsource/dist/index.html

          echo "✅ Vite build verified"
          echo "Build size:"
          du -sh mainsource/dist

      # --------------------------------------------------
      # 6. Deploy to Hostinger
      # --------------------------------------------------
      - name: 🚀 Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./mainsource/dist/
          server-dir: ./
          dangerous-clean-slate: false

      # --------------------------------------------------
      # 7. Deployment completed
      # --------------------------------------------------
      - name: ✅ Deployment Completed
        run: |
          echo "======================================"
          echo "🚀 INNERPECE WEBSITE DEPLOYMENT DONE"
          echo "======================================"
          echo "Branch: main"
          echo "Website: innerpece.com"
          echo "======================================"
